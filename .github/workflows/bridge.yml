name: Pi companion
on:
  push:
    paths: ["bridge/**", "package.json", ".github/workflows/bridge.yml"]
  pull_request:
    paths: ["bridge/**", "package.json", ".github/workflows/bridge.yml"]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test bridge/server.test.mjs
